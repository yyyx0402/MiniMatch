[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minimatch-search"
version = "0.1.0"
description = "Local product search with a fine-tuned MiniLM and BM25 hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=18,<25",
  "scikit-learn>=1.6,<2", "lightgbm>=4.5,<5", "joblib>=1.4,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "threadpoolctl>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
dense = ["torch>=2.7,<3", "transformers>=4.57,<6", "safetensors>=0.4"]

[project.scripts]
productsearch = "productsearch.__main__:main"
minimatch = "productsearch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
productsearch = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
